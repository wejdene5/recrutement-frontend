<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">
        <svg width="32" height="32" fill="none" stroke="white" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
          />
        </svg>
      </div>

      <h1>Créer un compte</h1>
      <p>Rejoignez notre plateforme de recrutement</p>
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      <div class="alert-icon">✅</div>
      <strong>Inscription réussie !</strong>
      {{ successMessage }}
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form *ngIf="!successMessage" [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Nom complet</label>

        <input
          formControlName="name"
          type="text"
          placeholder="John Doe"
          [class.input-error]="form.get('name')?.invalid && form.get('name')?.touched"
        />

        <span
          class="error-msg"
          *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
        >
          Minimum 2 caractères
        </span>
      </div>

      <div class="form-group">
        <label>Email</label>

        <input
          formControlName="email"
          type="email"
          placeholder="vous@exemple.com"
          [class.input-error]="form.get('email')?.invalid && form.get('email')?.touched"
        />

        <span
          class="error-msg"
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        >
          Format email invalide
        </span>
      </div>

      <div class="form-group">
        <label>
          Téléphone
          <span class="optional">(optionnel)</span>
        </label>

        <input
          formControlName="phoneNumber"
          type="tel"
          placeholder="+21612345678"
        />
      </div>

      <div class="form-group">
        <label>Mot de passe</label>

        <div class="input-wrapper">
          <input
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Minimum 8 caractères"
            [class.input-error]="form.get('password')?.invalid && form.get('password')?.touched"
          />

          <button
            type="button"
            class="toggle-pwd"
            (click)="showPassword = !showPassword"
          >
            <span *ngIf="!showPassword">👁️</span>
            <span *ngIf="showPassword">🙈</span>
          </button>
        </div>

        <div class="strength-bar">
          <div
            class="strength-segment"
            [class.active-weak]="passwordStrength >= 1"
          ></div>

          <div
            class="strength-segment"
            [class.active-medium]="passwordStrength >= 2"
          ></div>

          <div
            class="strength-segment"
            [class.active-strong]="passwordStrength >= 3"
          ></div>
        </div>

        <span
          class="strength-label"
          *ngIf="form.get('password')?.value"
        >
          <span *ngIf="passwordStrength === 1" style="color:#ef4444">
            Faible
          </span>

          <span *ngIf="passwordStrength === 2" style="color:#cef50b">
            Moyen
          </span>

          <span *ngIf="passwordStrength === 3" style="color:#10b981">
            Fort
          </span>
        </span>

        <span
          class="error-msg"
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
        >
          Minimum 8 caractères
        </span>
      </div>

      <div class="form-group">
        <label>Je suis</label>

        <select formControlName="role" class="role-select">
          <option value="CANDIDATE">Candidate</option>
          <option value="MANAGER">Entreprise / Manager</option>
        </select>
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || form.invalid"
      >
        <span class="spinner" *ngIf="loading"></span>

        {{ loading ? 'Création...' : "S'inscrire" }}
      </button>

    </form>

    <p class="auth-footer">
      Déjà un compte ?
      <a routerLink="/auth/login">Se connecter</a>
    </p>

  </div>
</div>
