<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">
        <svg width="32" height="32" fill="none" stroke="white" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          />
        </svg>
      </div>

      <h1>Réinitialiser le mot de passe</h1>
      <p>Choisissez un nouveau mot de passe</p>
    </div>

    <div class="alert alert-error" *ngIf="tokenMissing">
      Lien invalide : aucun jeton de réinitialisation trouvé.
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}<br />Redirection vers la connexion...
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form *ngIf="!tokenMissing && !successMessage" [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Nouveau mot de passe</label>

        <div class="input-wrapper">
          <input
            formControlName="newPassword"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Minimum 8 caractères"
            [class.input-error]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
          />

          <button
            type="button"
            class="toggle-pwd"
            (click)="showPassword = !showPassword"
          >
            <span *ngIf="!showPassword">👁️</span>
            <span *ngIf="showPassword">🙈</span>
          </button>
        </div>

        <span
          class="error-msg"
          *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
        >
          Minimum 8 caractères
        </span>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>

        <input
          formControlName="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Confirmez votre mot de passe"
          [class.input-error]="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched"
        />

        <span
          class="error-msg"
          *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched"
        >
          Les mots de passe ne correspondent pas
        </span>
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || form.invalid"
      >
        <span class="spinner" *ngIf="loading"></span>

        {{ loading ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
      </button>

    </form>

    <p class="auth-footer">
      <a routerLink="/auth/login">Retour à la connexion</a>
    </p>

  </div>
</div>
