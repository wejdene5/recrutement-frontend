<aside class="sidebar" [class.sidebar--open]="isMobileOpen">
  <nav>
    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       (click)="onLinkClick()">
      {{ item.label }}
    </a>
  </nav>
  <button class="logout-btn" (click)="logout()">Déconnexion</button>
</aside>
